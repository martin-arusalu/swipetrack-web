<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SwipeTrack for Android</title>
  <meta name="description" content="Get SwipeTrack on Android. Race 100m to 10,000m: download it free on Google Play." />
  <meta name="theme-color" content="#0d0a05" />
  <link rel="icon" href="icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: #0d0a05;
      color: #f4f5f8;
      line-height: 1.55;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 48px 32px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: rgba(240,124,26,0.15);
      color: #f07c1a;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 6px 14px;
      border-radius: 100px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 12px;
    }
    p {
      color: #a4a9b8;
      margin: 0 0 32px;
      font-size: 15px;
    }
    .note {
      margin-top: 24px;
      font-size: 13px;
      color: #6b7184;
    }
    .back {
      display: inline-block;
      margin-top: 28px;
      font-size: 14px;
      color: #a4a9b8;
      text-decoration: none;
    }
    .back:hover { color: #f4f5f8; }
    .play-badge { display: inline-block; }
    .play-badge img { display: block; height: 56px; width: auto; }
    .card.wide { max-width: 480px; text-align: left; }
    .card.wide .badge, .card.wide h1, .card.wide .lead { text-align: center; }
    .card.wide .badge { display: table; margin: 0 auto 20px; }
    .steps { list-style: none; margin: 0 0 24px; padding: 0; display: flex; flex-direction: column; gap: 12px; counter-reset: step; }
    .steps li {
      counter-increment: step;
      position: relative;
      padding: 16px 16px 16px 60px;
      border-radius: 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .steps li::before {
      content: counter(step);
      position: absolute;
      left: 16px;
      top: 16px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(240,124,26,0.15);
      color: #f07c1a;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .steps h2 { font-size: 16px; font-weight: 600; margin: 4px 0 4px; }
    .steps p { margin: 0 0 12px; font-size: 14px; }
    .step-btn {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 10px;
      background: #f07c1a;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s;
    }
    .step-btn:hover { background: #d96a10; }
    .callout {
      margin: 0 0 16px;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 14px;
      color: #a4a9b8;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .callout strong { color: #f4f5f8; }
    .callout ul { margin: 8px 0 0; padding-left: 20px; }
    .callout a, .note a { color: #f07c1a; }
    .card.wide .back { display: table; margin: 28px auto 0; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <span class="badge">Android</span>
    <h1>SwipeTrack is on Google Play</h1>
    <p>Race 100m to 10,000m on any phone with Android 7.1 or newer. Install it free and start racing.</p>
    <a class="play-badge" href="https://play.google.com/store/apps/details?id=com.martinarusalu.swipetrack" target="_blank" rel="noopener">
      <img src="img/google-play-badge.webp" alt="Get it on Google Play" width="188" height="56" />
    </a>
    <p class="note">On iPhone? <a href="https://apps.apple.com/us/app/swipetrack/id6768320211">Get SwipeTrack on the App Store</a>.</p>
    <a class="back" href="index.html">&larr; Back to SwipeTrack</a>
  </div>

  <template id="ios">
    <span class="badge">iPhone</span>
    <h1>SwipeTrack is on the App Store</h1>
    <p>Download it now and start racing.</p>
    <a class="step-btn" href="https://apps.apple.com/us/app/swipetrack/id6768320211">Download on the App Store</a>
    <br />
    <a class="back" href="index.html">&larr; Back to SwipeTrack</a>
  </template>

  <script>
    // iPhone and iPad visitors get the App Store link instead.
    var ua = navigator.userAgent;
    if (!/Android/i.test(ua) && (/iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1))) {
      var card = document.getElementById('card');
      card.innerHTML = document.getElementById('ios').innerHTML;
      card.classList.remove('wide');
    }
  </script>
</body>
</html>
